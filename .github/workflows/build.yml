name: Desktop build and package
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            platform: linux
          - os: windows-latest
            arch: x64
            platform: win
          - os: macos-15-intel
            arch: x64
            platform: mac
          - os: macos-15
            arch: arm64
            platform: mac
    runs-on: ${{ matrix.os }}
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'build' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked
      - run: npm run build
      - run: npm run test:smoke
      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Package unsigned test artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run package:ci -- --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Package signed release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ '${{ matrix.platform }}' = 'mac' ]; then
            test -n "$CSC_LINK" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID"
            npm run package:ci -- --mac --${{ matrix.arch }} -c.forceCodeSigning=true -c.mac.notarize=true
          elif [ '${{ matrix.platform }}' = 'win' ]; then
            test -n "$CSC_LINK"
            npm run package:ci -- --win --x64 -c.forceCodeSigning=true
          else
            npm run package:ci -- --linux --x64
          fi
        env:
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: DeGravity-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14
